[versions]
agp = "9.4.0"
appcompat = "1.8.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
shizuku = "13.1.5"
coil = "2.7.0"
datastore = "1.2.1"
markdownRenderer = "0.45.0"
splashscreen = "1.2.0"

tvMaterial = "1.1.0"
