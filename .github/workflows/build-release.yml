name: Build and Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version and Package ID
        id: get_info
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*= "//;s/".*//')
          APP_ID=$(grep "applicationId =" app/build.gradle.kts | sed 's/.*= "//;s/".*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"
          echo "Detected package ID: $APP_ID"

      - name: Decode Keystore
        id: decode_keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          echo "keystore_path=release.jks" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.get_info.outputs.version }}
          name: Release v${{ steps.get_info.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            config/${{ steps.get_info.outputs.package_id }}_${{ steps.get_info.outputs.version }}_config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
